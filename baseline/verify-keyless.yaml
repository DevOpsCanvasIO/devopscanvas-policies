apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata: { name: verify-keyless }
spec:
  validationFailureAction: enforce
  background: false
  rules:
    - name: require-cosign-keyless
      match: { resources: { kinds: [Pod, Deployment] } }
      verifyImages:
        - imageReferences: ["ghcr.io/ORG/*:*"]
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              conditions:
                - all:
                    - key: "predicate.builder.id"
                      operator: Equals
                      value: "https://github.com/ORGANIZATION/REPOSITORY/.github/workflows/deploy.yml@refs/heads/main"
          keyless:
            identities:
              - issuer: "https://token.actions.githubusercontent.com"
                subject: "repo:ORG/REPO:ref:refs/heads/main"
